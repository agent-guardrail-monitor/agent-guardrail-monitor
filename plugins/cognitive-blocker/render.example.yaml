services:
  - type: web
    name: cognitive-blocker-plugin
    runtime: node
    plan: free
    rootDir: plugins/cognitive-blocker
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INSTALL_SECRET
        sync: false
