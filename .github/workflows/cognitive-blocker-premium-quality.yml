name: Cognitive Blocker Premium Quality

on:
  push:
    branches:
      - feat/cognitive-blocker-plugin
    paths:
      - "plugins/cognitive-blocker/**"
      - ".github/workflows/cognitive-blocker-premium-quality.yml"
  pull_request:
    paths:
      - "plugins/cognitive-blocker/**"
      - ".github/workflows/cognitive-blocker-premium-quality.yml"
  workflow_dispatch:

jobs:
  runtime-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/cognitive-blocker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --omit=dev
      - run: npm audit --omit=dev --audit-level=moderate

  property-based:
    name: Property-based blocker invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/cognitive-blocker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run check
      - run: npm run test:property

  postgres-rls:
    name: Disposable PostgreSQL tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/cognitive-blocker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: docker info
      - run: npm install
      - run: npm run test:containers

  mutation:
    name: Mutation resistance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - property-based
    defaults:
      run:
        working-directory: plugins/cognitive-blocker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run test:mutation
