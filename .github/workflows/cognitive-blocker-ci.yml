name: Cognitive Blocker CI

on:
  push:
    branches:
      - main
    paths:
      - "plugins/cognitive-blocker/**"
      - ".github/workflows/cognitive-blocker-ci.yml"
  pull_request:
    paths:
      - "plugins/cognitive-blocker/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/cognitive-blocker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run check
      - run: npm test
